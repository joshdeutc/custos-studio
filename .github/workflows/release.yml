name: Build & Publish Custos Studio Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Release Keystore (if configured)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Custos Studio Monolithic Release APK & Play Store AAB
        env:
          RELEASE_KEYSTORE_FILE: /tmp/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleBasicRelease :app:bundleBasicRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/basic/release/*.apk dist/custos-studio-${{ github.ref_name }}.apk
          cp app/build/outputs/bundle/basicRelease/*.aab dist/custos-studio-${{ github.ref_name }}.aab

      - name: Clean up Keystore file
        if: always()
        run: rm -f /tmp/release.jks

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/custos-studio-${{ github.ref_name }}.apk
            dist/custos-studio-${{ github.ref_name }}.aab
          name: Custos Studio ${{ github.ref_name }}
          generate_release_notes: true